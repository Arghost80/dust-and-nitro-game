services:
  - type: web
    name: dust-and-nitro-game
    env: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: apex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_LEGACY_WAGER_API
        value: "false"
      - key: ALLOW_INSECURE_DEV_AUTH
        value: "false"
      - key: ECONOMY_ACTIONS_ENABLED
        value: "true"
      - key: TON_PURCHASES_ENABLED
        value: "true"
      - key: TELEGRAM_TON_PURCHASES_ENABLED
        value: "false"
      - key: TELEGRAM_STARS_PURCHASES_ENABLED
        value: "true"
      - key: NFT_ENTITLEMENTS_ENABLED
        value: "true"
      - key: TON_NFT_MINTING_ENABLED
        value: "false"
      - key: TON_NFT_NETWORK
        value: ton-testnet
      - key: ENABLE_WAGER_STAKES
        value: "false"
      - key: ENABLE_MARKETPLACE
        value: "false"
      - key: ENABLE_WEEKLY_TOURNAMENT
        value: "false"
      - key: ENABLE_REFERRAL_REWARDS
        value: "true"
      - key: ENABLE_AD_REWARDS
        value: "true"
      - key: DB_BACKUP_ENABLED
        value: "true"
      - key: DB_BACKUP_DIR
        value: /var/data/apex_backups
      - key: DB_BACKUP_INTERVAL_HOURS
        value: "6"
      - key: DB_BACKUP_RETENTION
        value: "14"
      - key: TEAM_BOOTSTRAP_TELEGRAM_IDS
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_AUDIT_TOKEN
        sync: false
      - key: ADSGRAM_WEBHOOK_SECRET
        sync: false
      - key: SERVER_SECRET_KEY
        generateValue: true
      - key: TREASURY_WALLET_ADDRESS
        value: UQD4ivLM7PJ7XpX_CflUUhoZW361xvOH4WP869C9WghJAN4X
      - key: TONCENTER_API_KEY
        sync: false
      - key: TONAPI_KEY
        sync: false
      - key: TON_USDT_RATE_OVERRIDE
        sync: false
      - key: TON_NFT_COLLECTION_ADDRESS
        sync: false
      - key: TON_NFT_COLLECTION_OWNER_ADDRESS
        sync: false
      - key: TON_NFT_ROYALTY_ADDRESS
        sync: false
      - key: TON_NFT_CLAIM_AMOUNT_NANOTONS
        value: "40000000"
      - key: TON_NFT_ITEM_RESERVE_NANOTONS
        value: "15000000"
      - key: TON_NFT_COLLECTION_RESERVE_NANOTONS
        value: "5000000"
      - key: TON_NFT_METADATA_BASE_URL
        sync: false
