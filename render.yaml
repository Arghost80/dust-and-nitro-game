services:
  - type: web
    name: dust-and-nitro-game
    env: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: apex-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "true"
      - key: ENABLE_LEGACY_WAGER_API
        value: "false"
      - key: ALLOW_INSECURE_DEV_AUTH
        value: "false"
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_AUDIT_TOKEN
        sync: false
      - key: ADSGRAM_WEBHOOK_SECRET
        sync: false
      - key: SERVER_SECRET_KEY
        generateValue: true
