<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real GP Motorsport - Official GT3 Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Phaser 3.60 Canvas Game Engine -->
    <script src="assets/phaser.min.js"></script>
</head>
<body>
    <!-- Barra superior de navegación entre modos -->
    <!-- Barra superior de navegación entre modos -->
    <div class="mode-switch-bar">
        <a href="drawrace.html" class="mode-btn-active">
            <span>🎮 MODO 3D (DRAWRACE DIORAMA)</span>
            <span>▶</span>
        </a>
    </div>

    <!-- Indicador de Próxima Curva y Guía -->
    <div id="next-corner-box">
        <span id="corner-icon">↰</span>
        <span id="corner-name">CURVA 1</span>
        <span id="corner-action" class="brake">FRENAR</span>
    </div>

    <div id="game-container"></div>

    <!-- Telemetría Oficial de Retransmisión GT3 -->
    <div id="gt-hud-bar">
        <div class="gt-hud-col">
            <span class="gt-hud-label">POS</span>
            <div class="gt-hud-val gt-hud-pos"><span id="hud-pos">P1</span><span style="font-size:12px; color:#64748b;">/6</span></div>
        </div>
        <div class="gt-hud-col">
            <span class="gt-hud-label">VUELTA</span>
            <div class="gt-hud-val" id="hud-lap">1/3</div>
        </div>
        <div class="gt-hud-col">
            <span class="gt-hud-label">TIEMPO VUELTA</span>
            <div class="gt-hud-val" id="hud-time" style="color:#38bdf8;">00:00.0</div>
        </div>
        <div class="gt-hud-col" style="align-items:flex-end;">
            <span class="gt-hud-label">TELEMETRÍA</span>
            <div class="gt-hud-val gt-hud-speed">
                <span id="hud-speed">0</span>
                <span style="font-size:11px; color:#94a3b8;">KM/H</span>
                <span class="gt-gear-badge" id="hud-gear">G1</span>
            </div>
            <div class="gt-rpm-bar-container"><div id="gt-rpm-fill"></div></div>
        </div>
    </div>

    <!-- Tabla de Posiciones en Directo -->
    <div id="gt-leaderboard">
        <div class="lb-title">🏁 GP GRID CLASSIFICATION</div>
        <div id="lb-entries"></div>
    </div>

    <!-- Advertencia de Fuera de Pista (Gravilla/Césped) -->
    <div id="gt-offtrack">⚠️ FUERA DE PISTA (GRASS / GRAVEL)</div>

    <!-- Minimapa Radar en tiempo real -->
    <canvas id="gt-radar-canvas" width="140" height="90"></canvas>

    <!-- Controles táctiles pantalla para móviles en Telegram -->
    <div id="touch-controls" class="touch-controls">
        <div class="control-group left-group">
            <button id="btn-left" class="btn-touch">◀ A</button>
            <button id="btn-right" class="btn-touch">▶ D</button>
        </div>
        <div class="control-group right-group">
            <button id="btn-accel" class="btn-touch btn-action btn-green">GAS (W / ↑)</button>
            <button id="btn-brake" class="btn-touch btn-action btn-yellow">FRENO (S / ↓)</button>
        </div>
    </div>

    <!-- Motor de Juego Real GP GT3 Motorsport con Vallas y Trazada Guiada -->
    <script src="real_gt_race.js?v=3"></script>
</body>
</html>
