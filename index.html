<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Motorsport - Web3 NFT GT Circuit Edition</title>
    <link rel="stylesheet" href="style.css?v=65">
    <link rel="stylesheet" href="hub_styles.css?v=65">
    <!-- Telegram WebApp SDK (carga asíncrona no bloqueante) -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <!-- Adsgram SDK Oficial (Rewarded Video Ads para Telegram Mini Apps) -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <!-- Phaser 3.60 Canvas Game Engine -->
    <script src="assets/phaser.min.js"></script>
</head>
<body>
    <!-- PANTALLA DE CARGA Y PRESENTACIÓN DE CARRERAS (RACING PRELOADER) -->
    <div id="game-preloader" class="game-preloader">
        <div class="preloader-bg-ambient"></div>
        <div class="preloader-content">
            <!-- Semáforo de Salida FIA (5 Luces de Competición) -->
            <div class="fia-gantry">
                <div class="fia-gantry-frame">
                    <span class="fia-light" id="fia-l1"></span>
                    <span class="fia-light" id="fia-l2"></span>
                    <span class="fia-light" id="fia-l3"></span>
                    <span class="fia-light" id="fia-l4"></span>
                    <span class="fia-light" id="fia-l5"></span>
                </div>
                <div class="fia-status-badge" id="fia-status">START SEQUENCE</div>
            </div>

            <!-- Logo y Emblema de Carreras -->
            <div class="preloader-branding">
                <div class="preloader-badge">⚡ WEB3 MOTORSPORT ⚡</div>
                <h1 class="preloader-title">DUST <span class="accent-nitro">&</span> NITRO</h1>
                <div class="preloader-subtitle">GT CIRCUIT RACING CHAMPIONSHIP</div>
            </div>

            <!-- Ilustración de Coches de Carreras enfrentados -->
            <div class="preloader-cars-stage">
                <div class="car-rival car-red-gt">
                    <div class="car-headlight left"></div>
                    <div class="car-headlight right"></div>
                    <svg viewBox="0 0 160 80" class="racing-car-svg">
                        <defs>
                            <linearGradient id="gtRedGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#ef4444"/>
                                <stop offset="50%" stop-color="#dc2626"/>
                                <stop offset="100%" stop-color="#991b1b"/>
                            </linearGradient>
                            <linearGradient id="gtCockpit" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#38bdf8"/>
                                <stop offset="100%" stop-color="#0369a1"/>
                            </linearGradient>
                        </defs>
                        <!-- Spoiler alerón GT3 -->
                        <rect x="8" y="18" width="8" height="44" rx="2" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
                        <!-- Chasis aerodinámico -->
                        <path d="M 16 26 L 50 20 L 95 18 L 135 25 L 152 35 L 152 45 L 135 55 L 95 62 L 50 60 L 16 54 Z" fill="url(#gtRedGrad)" stroke="#fee2e2" stroke-width="1"/>
                        <!-- Cockpit cabina de carreras -->
                        <path d="M 55 28 L 85 26 L 105 32 L 105 48 L 85 54 L 55 52 Z" fill="url(#gtCockpit)"/>
                        <!-- Líneas de carrera vinilo -->
                        <path d="M 16 40 L 150 40" stroke="#ffffff" stroke-width="3" stroke-dasharray="12 4"/>
                        <!-- Ruedas slick -->
                        <rect x="32" y="10" width="22" height="10" rx="3" fill="#18181b" stroke="#facc15" stroke-width="1"/>
                        <rect x="32" y="60" width="22" height="10" rx="3" fill="#18181b" stroke="#facc15" stroke-width="1"/>
                        <rect x="110" y="11" width="24" height="10" rx="3" fill="#18181b" stroke="#facc15" stroke-width="1"/>
                        <rect x="110" y="59" width="24" height="10" rx="3" fill="#18181b" stroke="#facc15" stroke-width="1"/>
                    </svg>
                    <div class="underglow-red"></div>
                </div>

                <div class="vs-badge">VS</div>

                <div class="car-rival car-cyan-gt">
                    <div class="car-headlight left"></div>
                    <div class="car-headlight right"></div>
                    <svg viewBox="0 0 160 80" class="racing-car-svg flipped">
                        <defs>
                            <linearGradient id="gtCyanGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#06b6d4"/>
                                <stop offset="50%" stop-color="#0284c7"/>
                                <stop offset="100%" stop-color="#1e3a8a"/>
                            </linearGradient>
                        </defs>
                        <!-- Spoiler alerón GT3 -->
                        <rect x="8" y="18" width="8" height="44" rx="2" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
                        <!-- Chasis aerodinámico -->
                        <path d="M 16 26 L 50 20 L 95 18 L 135 25 L 152 35 L 152 45 L 135 55 L 95 62 L 50 60 L 16 54 Z" fill="url(#gtCyanGrad)" stroke="#cffafe" stroke-width="1"/>
                        <!-- Cockpit cabina de carreras -->
                        <path d="M 55 28 L 85 26 L 105 32 L 105 48 L 85 54 L 55 52 Z" fill="#0f172a"/>
                        <!-- Líneas de carrera vinilo -->
                        <path d="M 16 40 L 150 40" stroke="#facc15" stroke-width="3" stroke-dasharray="12 4"/>
                        <!-- Ruedas slick -->
                        <rect x="32" y="10" width="22" height="10" rx="3" fill="#18181b" stroke="#38bdf8" stroke-width="1"/>
                        <rect x="32" y="60" width="22" height="10" rx="3" fill="#18181b" stroke="#38bdf8" stroke-width="1"/>
                        <rect x="110" y="11" width="24" height="10" rx="3" fill="#18181b" stroke="#38bdf8" stroke-width="1"/>
                        <rect x="110" y="59" width="24" height="10" rx="3" fill="#18181b" stroke="#38bdf8" stroke-width="1"/>
                    </svg>
                    <div class="underglow-cyan"></div>
                </div>
            </div>

            <!-- Tacómetro / Barra de Progreso de Aceleración -->
            <div class="preloader-progress-box">
                <div class="tachometer-header">
                    <span class="tacho-label">🚀 TELEMETRÍA DE SALIDA</span>
                    <span class="tacho-rpm" id="preloader-rpm">0 RPM</span>
                    <span class="tacho-percent" id="preloader-pct">0%</span>
                </div>
                <div class="tachometer-track">
                    <div class="tachometer-fill" id="preloader-fill"></div>
                </div>
                <div class="preloader-tip" id="preloader-tip">Calentando neumáticos slick y ajustando presiones...</div>
            </div>
        </div>
    </div>

    <!-- PORTAL WEB3 Y HUB PRINCIPAL DEL JUEGO -->
    <div id="game-hub-root">
        <!-- Barra Superior con Perfil, Saldos y Ajustes ⚙️ -->
        <header id="hub-header" class="hub-header"></header>

        <!-- Contenedor Dinámico de Vistas -->
        <main class="hub-view-container">
            <!-- 1. Vista Principal (Hero & 5 Zonas Principales) -->
            <section id="view-main" class="hub-view active"></section>

            <!-- 2. Vista Garaje NFT (75+ Coches Coleccionables) -->
            <section id="view-garage" class="hub-view"></section>

            <!-- 3. Vista Cajas Misteriosas NFT (Web3 Gacha) -->
            <section id="view-crates" class="hub-view"></section>

            <!-- 4. Vista Tienda Oficial (Upgrades & Tokens) -->
            <section id="view-shop" class="hub-view"></section>

            <!-- 5. Vista Competición & Multijugador -->
            <section id="view-comp" class="hub-view"></section>
        </main>

        <!-- Modal de Ajustes ⚙️ (Idiomas, Audio, Gráficos, Controles) -->
        <div id="settings-modal" class="settings-modal hidden" style="display: none;"></div>
    </div>

    <!-- Contenedor del Juego Phaser 2D Canvas -->
    <div id="game-container"></div>

    <!-- Contenedor neutro para compatibilidad de tests (sin popup invasivo) -->
    <div id="rotate-prompt" style="display: none;"></div>

    <!-- Controles táctiles pantalla para móviles en Telegram (Ocultos en menús, activos solo en carrera) -->
    <div id="touch-controls" class="touch-controls hidden" style="display: none;">
        <!-- Selector rápido de modo de control táctil (Joystick o Botones) -->
        <button type="button" class="touch-mode-toggle" id="touch-mode-toggle" onclick="toggleTouchControlMode()">
            <span id="touch-mode-label">🕹️ JOYSTICK (TAP)</span>
        </button>

        <!-- Opción A: Círculo Joystick Virtual Táctil 360° -->
        <div id="virtual-joystick-container" class="virtual-joystick-container">
            <div id="joystick-base" class="joystick-base">
                <span class="j-dir j-up">▲</span>
                <span class="j-dir j-down">▼</span>
                <span class="j-dir j-left">◀</span>
                <span class="j-dir j-right">▶</span>
                <div id="joystick-stick" class="joystick-stick"></div>
            </div>
        </div>

        <!-- Opción B: Botones Táctiles Clásicos (Aumentados +50% tamaño) -->
        <div id="touch-buttons-group" class="control-group left-group hidden" style="display: none;">
            <button id="btn-left" class="btn-touch btn-steer">◀</button>
            <button id="btn-right" class="btn-touch btn-steer">▶</button>
        </div>

        <!-- Grupo Derecho: Botonera Radial Semicírculo Estilo RPG / Acción -->
        <div class="control-group right-group rpg-cluster">
            <button id="btn-nitro" class="btn-touch btn-action btn-nitro" title="Óxido Nitroso N2O (2s Boost)">
                <span class="nitro-icon">🧪</span>
                <span class="nitro-label">NITRO</span>
                <span class="nitro-badge" id="nitro-badge-count">2</span>
            </button>
            <button id="btn-handbrake" class="btn-touch btn-action btn-cyan btn-handbrake" title="Freno de Mano / Derrape">💨<br>DERRAPE</button>
            <button id="btn-brake" class="btn-touch btn-action btn-yellow" title="Freno / Marcha Atrás">🛑<br>FRENO</button>
            <button id="btn-accel" class="btn-touch btn-action btn-green" title="Acelerador">🚀<br>GAS</button>
        </div>
    </div>

    <!-- Módulos de Datos, Traducciones y Lógica Web3 -->
    <script src="translations.js?v=65"></script>
    <script src="nft_cars_data.js?v=65"></script>
    <script src="tracks_data.js?v=65"></script>
    <script src="dustrac_game.js?v=65"></script>
    <script src="game_hub.js?v=65"></script>
</body>
</html>
