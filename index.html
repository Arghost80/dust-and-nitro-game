<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Rally 2D - Neo Tokyo Grand Prix</title>
    <link rel="stylesheet" href="style.css">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Phaser 3.60 Canvas Game Engine -->
    <script src="assets/phaser.min.js"></script>
</head>
<body>
    <!-- Barra superior de navegación entre modos -->
    <div style="position:fixed; top:12px; right:12px; z-index:999; display:flex; gap:8px;">
        <a href="drawrace.html" style="background:linear-gradient(135deg, #00f5d4, #ff007f); color:#020617; font-family:sans-serif; font-size:12px; font-weight:900; padding:8px 16px; border-radius:20px; text-decoration:none; box-shadow:0 0 20px rgba(0,245,212,0.8); display:flex; align-items:center; gap:6px; border:1px solid #ffffff;">
            <span>🏎️ JUGAR MODO 3D (CYBER-APEX)</span>
            <span>▶</span>
        </a>
        <a href="dustrac_classic.html" style="background:rgba(15, 23, 42, 0.9); color:#94a3b8; font-family:sans-serif; font-size:11px; font-weight:800; padding:8px 12px; border-radius:20px; text-decoration:none; display:flex; align-items:center; gap:4px; border:1px solid rgba(148, 163, 184, 0.4);">
            <span>🏁 MODO RETRO 2005</span>
        </a>
    </div>
    <div id="game-container"></div>

    <!-- Controles táctiles pantalla para móviles en Telegram -->
    <div id="touch-controls" class="touch-controls">
        <div class="control-group left-group">
            <button id="btn-left" class="btn-touch">◀ A</button>
            <button id="btn-right" class="btn-touch">▶ D</button>
        </div>
        <div class="control-group right-group">
            <button id="btn-accel" class="btn-touch btn-action btn-green">GAS (W / ↑)</button>
            <button id="btn-brake" class="btn-touch btn-action btn-yellow">FRENO (S / ↓)</button>
        </div>
    </div>

    <!-- Motor de Juego Cyber Rally 2D Hi-Res -->
    <script src="cyber_race_2d.js?v=2"></script>
</body>
</html>
