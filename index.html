<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Motorsport - Web3 NFT GT Circuit Edition</title>
    <link rel="stylesheet" href="style.css?v=44">
    <link rel="stylesheet" href="hub_styles.css?v=44">
    <!-- Telegram WebApp SDK (carga asíncrona no bloqueante) -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <!-- Phaser 3.60 Canvas Game Engine -->
    <script src="assets/phaser.min.js"></script>
</head>
<body>
    <!-- PORTAL WEB3 Y HUB PRINCIPAL DEL JUEGO -->
    <div id="game-hub-root">
        <!-- Barra Superior con Perfil, Saldos y Ajustes ⚙️ -->
        <header id="hub-header" class="hub-header"></header>

        <!-- Contenedor Dinámico de Vistas -->
        <main class="hub-view-container">
            <!-- 1. Vista Principal (Hero & 5 Zonas Principales) -->
            <section id="view-main" class="hub-view active"></section>

            <!-- 2. Vista Garaje NFT (75+ Coches Coleccionables) -->
            <section id="view-garage" class="hub-view"></section>

            <!-- 3. Vista Cajas Misteriosas NFT (Web3 Gacha) -->
            <section id="view-crates" class="hub-view"></section>

            <!-- 4. Vista Tienda Oficial (Upgrades & Tokens) -->
            <section id="view-shop" class="hub-view"></section>

            <!-- 5. Vista Competición & Multijugador -->
            <section id="view-comp" class="hub-view"></section>
        </main>

        <!-- Modal de Ajustes ⚙️ (Idiomas, Audio, Gráficos, Controles) -->
        <div id="settings-modal" class="settings-modal hidden" style="display: none;"></div>
    </div>

    <!-- Contenedor del Juego Phaser 2D Canvas -->
    <div id="game-container"></div>

    <!-- Controles táctiles pantalla para móviles en Telegram -->
    <div id="touch-controls" class="touch-controls">
        <div class="control-group left-group">
            <button id="btn-left" class="btn-touch">◀ A</button>
            <button id="btn-right" class="btn-touch">▶ D</button>
        </div>
        <div class="control-group right-group">
            <button id="btn-handbrake" class="btn-touch btn-action btn-cyan btn-handbrake" title="Freno de Mano / Derrape (Barra Espaciadora / Shift)">💨 DERRAPE<br><small style="font-size:8px;opacity:0.85;">(ESPACIO)</small></button>
            <button id="btn-accel" class="btn-touch btn-action btn-green">GAS<br><small style="font-size:8px;opacity:0.85;">(W / ↑)</small></button>
            <button id="btn-brake" class="btn-touch btn-action btn-yellow">FRENO<br><small style="font-size:8px;opacity:0.85;">(S / ↓)</small></button>
        </div>
    </div>

    <!-- Módulos de Datos, Traducciones y Lógica Web3 -->
    <script src="translations.js?v=44"></script>
    <script src="nft_cars_data.js?v=44"></script>
    <script src="tracks_data.js?v=44"></script>
    <script src="dustrac_game.js?v=44"></script>
    <script src="game_hub.js?v=44"></script>
</body>
</html>
