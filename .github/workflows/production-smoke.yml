name: Production smoke

on:
  schedule:
    # GitHub puede retrasar los cron; esto complementa, no sustituye, el
    # health check de Render ni una alerta externa en tiempo real.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Tratar configuración incompleta como fallo'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Public production checks
        shell: bash
        run: |
          ARGS=(https://dust-and-nitro-game.onrender.com --skip-version)
          if [ "${{ inputs.strict }}" = "true" ]; then
            ARGS+=(--strict)
          fi
          node scripts/production_smoke.js "${ARGS[@]}"
